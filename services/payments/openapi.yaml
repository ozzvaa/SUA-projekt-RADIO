openapi: 3.1.0
info:
  title: Payments API
  version: 1.0.0
  description: API for creating payments, checking and updating their status.
servers:
  - url: http://localhost:8080
    description: Local API gateway
tags:
  - name: Payments
paths:
  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Start a payment
      description: Creates a payment request. The payment may remain pending until the provider confirms it.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "201":
          description: Payment request created
          content:
            application/json: {}
        "400":
          description: Invalid payment data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get payment status
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment details and current status
          content:
            application/json: {}
        "404":
          description: Payment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Payments]
      operationId: updatePayment
      summary: Update payment data
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment details updated
          content:
            application/json: {}
        "400":
          description: Invalid payment data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Payment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Payments]
      operationId: deletePayment
      summary: Delete a payment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Payments deleted
        '404':
          description: Payments not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/webhook:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Receive a payment provider update
      description: Endpoint called by the payment provider when a payment status changes.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "200":
          description: Provider update received
        "400":
          description: Invalid webhook payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Payment identifier.
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

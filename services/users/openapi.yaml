openapi: 3.1.0
info:
  title: Users API
  version: 1.0.0
  description: API for user registration, login, and account management.
servers:
  - url: http://localhost:8080
    description: Local API gateway
tags:
  - name: Users
paths:
  /users/register:
    post:
      tags: [Users]
      operationId: registerUser
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409':
          description: Username is already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/login:
    post:
      tags: [Users]
      operationId: loginUser
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Username or password is incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Authentication required or token invalid
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid profile data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user account
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User account deleted
        '401':
          description: Authentication required or token invalid
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: User identifier.
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, format: password, writeOnly: true, example: example-password }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        username: { type: string, example: new-alice }
        password: { type: string, format: password, writeOnly: true, example: example-new-password}
        email: { type: string, format: email, example: alice@example.com }
    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string, example: user-123 }
        username: { type: string, example: alice }
        email: { type: string, format: email, example: alice@example.com }
    LoginResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken: { type: string, example: example-token }
        tokenType: { type: string, example: Bearer }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
